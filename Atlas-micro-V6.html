<title>Linux Atlas Micro — 215 systems</title>
<style>
html{background:#e9e9e9;color:#111}
body{margin:0;background:#fff;color:#111;font:13px Arial,Helvetica,sans-serif;line-height:1.35}
a{color:#0645ad}
#top{background:#d6d6d6;border-bottom:1px solid #777;padding:7px 8px}
#top h1{display:inline;margin:0 15px 0 0;font-size:18px}
#top .sub{font-size:11px;color:#333}
.wrap{width:96%;max-width:1100px;margin:0 auto}
.nav{padding:6px 0;white-space:nowrap;overflow:auto}
.nav a,.btn{display:inline-block;margin:2px 3px 2px 0;padding:4px 7px;border:1px solid #777;background:#eee;color:#111;text-decoration:none;cursor:pointer}
.nav a:hover,.btn:hover{background:#ddd}
.panel{border:1px solid #999;background:#f7f7f7;padding:8px;margin:8px 0}
.field{margin:4px 0}.field label{display:inline-block;width:105px;font-weight:bold}
input,select{border:1px solid #777;background:#fff;color:#111;padding:3px;font:13px Arial,Helvetica,sans-serif}
#query{width:230px;max-width:70%}
.small{font-size:11px;color:#444}.muted{color:#555}
.card{display:inline-block;vertical-align:top;width:31.8%;margin:0 1.1% 8px 0;border:1px solid #999;background:#fff;min-height:210px;*display:inline;zoom:1}
.card h3{font-size:15px;margin:0;padding:6px;background:#e6e6e6;border-bottom:1px solid #aaa}
.card .body{padding:7px}.tag{display:inline-block;border:1px solid #aaa;background:#eee;padding:2px 4px;margin:2px 2px 2px 0;font-size:11px}
.score{font-size:11px;color:#333;margin-top:5px}
.pager{clear:both;padding:8px 0}
hr{border:0;border-top:1px solid #bbb;margin:8px 0}
pre.guide{white-space:pre-wrap;word-wrap:break-word;background:#fff;border:1px solid #aaa;padding:7px;font:12px/1.4 Arial,Helvetica,sans-serif}
.kv{width:100%;border-collapse:collapse}.kv td{border:1px solid #aaa;padding:4px;vertical-align:top}.kv td:first-child{width:190px;font-weight:bold;background:#eee}
.status-active{color:#075c00;font-weight:bold}.status-discontinued{color:#8a2d00;font-weight:bold}
.notice{padding:7px;background:#fff4c2;border:1px solid #bb9a2b}
.ok{padding:7px;background:#e9f7e9;border:1px solid #7daa7d}
.error{padding:7px;background:#fbe9e9;border:1px solid #b76c6c}
.hide{display:none}
@media(max-width:700px){.card{width:99%;margin-right:0}.wrap{width:98%}.field label{display:block;width:auto}.field input,.field select{width:96%;max-width:96%}#query{max-width:96%;width:96%}}
</style>

function card(o){var st=o.status=='active'?'active':'discontinued';return '<div class="card"><h3>#'+esc(o.id)+' — '+esc(o.name)+'</h3><div class="body"><div><span class="tag">'+esc(o.family)+'</span><span class="tag">'+esc(o.category)+'</span><span class="tag">'+esc(statusText(o.status))+'</span></div><p>'+esc(val(o.philosophy))+'</p><table class="kv"><tr><td>'+esc(E[LANG].desktop)+'</td><td>'+esc(o.desktop)+'</td></tr><tr><td>'+esc(E[LANG].requirements)+'</td><td>RAM: '+esc(o.ramMin)+' / '+esc(o.ramRec)+'<br>Disk: '+esc(o.diskMin)+' / '+esc(o.diskRec)+'</td></tr><tr><td>'+esc(E[LANG].environment)+'</td><td>'+esc(o.environment)+'</td></tr></table><div class="score">'+esc(E[LANG].lightness)+': '+esc(humanScore(o))+' &nbsp; <span class="status-'+st+'">'+esc(statusText(o.status))+'</span></div><p><button class="btn" onclick="Atlas.openOS('+o.id+')">'+esc(E[LANG].detail)+'</button> <button class="btn" onclick="Atlas.addCompare('+o.id+')">'+esc(E[LANG].compare)+'</button></p></div></div>'}
function renderHome(){var arr=filtered(),pages=Math.max(1,Math.ceil(arr.length/PAGE_SIZE));if(PAGE>pages)PAGE=pages;var start=(PAGE-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,arr.length);var html='<div class="panel"><b>'+esc(E[LANG].home)+'</b><p>'+esc(E[LANG].desc)+'</p><p class="small">'+esc(E[LANG].tip)+'</p></div><div class="panel"><div class="field"><label>'+esc(E[LANG].search)+'</label><input id="q" value="'+esc(QUERY)+'" onkeyup="Atlas.searchKey(event)" /></div><div class="field"><label>'+esc(E[LANG].family)+'</label><select id="family" onchange="Atlas.setFamily(this.value)"><option value="all">'+esc(E[LANG].all)+'</option>'+familyOptions()+'</select></div><div class="field"><label>'+esc(E[LANG].status)+'</label><select id="status" onchange="Atlas.setStatus(this.value)"><option value="all">'+esc(E[LANG].all)+'</option><option value="active">'+esc(E[LANG].active)+'</option><option value="discontinued">'+esc(E[LANG].disc)+'</option></select></div><div class="field"><label>'+esc(E[LANG].sort)+'</label><select id="sort" onchange="Atlas.setSort(this.value)"><option value="id">'+esc(E[LANG].id)+'</option><option value="name">'+esc(E[LANG].name)+'</option><option value="light">'+esc(E[LANG].light)+'</option></select> <button class="btn" onclick="Atlas.toggleView()">'+esc(VIEW=='cards'?E[LANG].table:E[LANG].cards)+'</button> <button class="btn" onclick="Atlas.reset()">'+esc(E[LANG].reset)+'</button></div></div>';
html+='<div class="panel"><b>'+arr.length+'</b> / '+DATA.length+' '+esc(E[LANG].count)+' — '+esc(E[LANG].families)+': '+families.length+'</div>';
if(VIEW=='cards'){html+='<div id="cards">';for(var i=start;i<end;i++)html+=card(arr[i]);html+='</div>'}else html+=table(arr,start,end);
html+='<div class="pager"><button class="btn" onclick="Atlas.page(-1)" '+(PAGE<=1?'disabled':'')+'>'+esc(E[LANG].prev)+'</button> '+PAGE+' / '+pages+' <button class="btn" onclick="Atlas.page(1)" '+(PAGE>=pages?'disabled':'')+'>'+esc(E[LANG].next)+'</button></div>';
$('content').innerHTML=html;if($('family'))$('family').value=FAMILY;if($('status'))$('status').value=STATUS;if($('sort'))$('sort').value=SORT;if($('q'))$('q').focus();}
function familyOptions(){var h='';for(var i=0;i<families.length;i++)h+='<option value="'+esc(families[i])+'">'+esc(families[i])+' ('+familyCounts[families[i]]+')</option>';return h}
function table(arr,start,end){var h='<table class="kv"><tr><td>#</td><td>Name</td><td>Family</td><td>Status</td><td>RAM</td><td>Desktop</td><td>Light</td><td></td></tr>';for(var i=start;i<end;i++){var o=arr[i];h+='<tr><td>'+o.id+'</td><td>'+esc(o.name)+'</td><td>'+esc(o.family)+'</td><td>'+esc(statusText(o.status))+'</td><td>'+esc(o.ramMin)+' / '+esc(o.ramRec)+'</td><td>'+esc(o.desktop)+'</td><td>'+esc(humanScore(o))+'</td><td><button class="btn" onclick="Atlas.openOS('+o.id+')">'+esc(E[LANG].detail)+'</button></td></tr>'}return h+'</table>'}
function detail(o){if(!o){location.hash='#home';return}var hw=o._atlas6Hw||{};var h='<div class="panel"><button class="btn" onclick="Atlas.goHome()">'+esc(E[LANG].back)+'</button> <button class="btn" onclick="Atlas.addCompare('+o.id+')">'+esc(E[LANG].compare)+'</button></div><div class="panel"><h2>#'+esc(o.id)+' — '+esc(o.name)+'</h2><div><span class="tag">'+esc(o.family)+'</span><span class="tag">'+esc(o.category)+'</span><span class="tag">'+esc(statusText(o.status))+'</span></div></div><div class="panel"><h3>'+esc(E[LANG].philosophy)+'</h3><p>'+esc(val(o.philosophy))+'</p><table class="kv"><tr><td>'+esc(E[LANG].requirements)+'</td><td>CPU min: '+esc(o.cpuMin||hw.cpuMin||'')+'<br>CPU rec: '+esc(o.cpuRec||hw.cpuRec||'')+'<br>RAM min: '+esc(o.ramMin)+'<br>RAM rec: '+esc(o.ramRec)+'<br>Disk min: '+esc(o.diskMin)+'<br>Disk rec: '+esc(o.diskRec)+'<br>Architecture: '+esc(hw.arch||'')+'<br>GPU: '+esc(hw.gpu||'')+'</td></tr><tr><td>'+esc(E[LANG].desktop)+'</td><td>'+esc(o.desktop)+'</td></tr><tr><td>'+esc(E[LANG].environment)+'</td><td>'+esc(o.environment)+'</td></tr></table></div>';
var guide=val(o.extendedGuide);h+='<div class="panel"><h3>'+esc(E[LANG].guide)+'</h3><pre class="guide">'+esc(guide)+'</pre></div>';
if(hw.commands&&hw.commands.length){h+='<div class="panel"><h3>'+esc(E[LANG].commands)+'</h3><ul>';for(var i=0;i<hw.commands.length;i++)h+='<li><code>'+esc(hw.commands[i])+'</code></li>';h+='</ul></div>'}
if(hw.sources&&hw.sources.length){h+='<div class="panel"><h3>'+esc(E[LANG].sources)+'</h3><ul>';for(var j=0;j<hw.sources.length;j++){var s=hw.sources[j],u=typeof s=='string'?s:(s.url||s.href||'');var t=typeof s=='string'?s:(s.title||s.name||u);h+='<li><a href="'+esc(u)+'">'+esc(t)+'</a></li>'}h+='</ul></div>'}
$('content').innerHTML=h}
function analytics(){var active=0,disc=0,totalLight=0;for(var i=0;i<DATA.length;i++){if(DATA[i].status=='active')active++;else disc++;totalLight+=(DATA[i].scores&&DATA[i].scores.light)||0}var h='<div class="panel"><h2>'+esc(E[LANG].analytics)+'</h2><table class="kv"><tr><td>'+esc(E[LANG].count)+'</td><td>'+DATA.length+'</td></tr><tr><td>'+esc(E[LANG].active)+'</td><td>'+active+'</td></tr><tr><td>'+esc(E[LANG].disc)+'</td><td>'+disc+'</td></tr><tr><td>'+esc(E[LANG].families)+'</td><td>'+families.length+'</td></tr><tr><td>'+esc(E[LANG].lightness)+'</td><td>'+(totalLight/DATA.length).toFixed(2)+'/5</td></tr></table></div><div class="panel"><h3>'+esc(E[LANG].families)+'</h3><table class="kv">';for(var i=0;i<families.length;i++)h+='<tr><td>'+esc(families[i])+'</td><td>'+familyCounts[families[i]]+'</td></tr>';h+='</table></div>';$('content').innerHTML=h}
function compare(){if(COMPARE_A==null||COMPARE_B==null){$('content').innerHTML='<div class="notice">'+esc(LANG=='ru'?'Выберите две системы кнопками «Сравнить» в каталоге.':'Choose two systems using the Compare buttons in the catalog.')+'</div>';return}var a=byId(COMPARE_A),b=byId(COMPARE_B);var keys=['comfort','light','daily','visual'];var h='<div class="panel"><button class="btn" onclick="Atlas.goHome()">'+esc(E[LANG].back)+'</button><h2>'+esc(E[LANG].compare)+'</h2><table class="kv"><tr><td></td><td>'+esc(a.name)+'</td><td>'+esc(b.name)+'</td></tr>';for(var i=0;i<keys.length;i++){var k=keys[i],av=(a.scores||{})[k]||0,bv=(b.scores||{})[k]||0;h+='<tr><td>'+esc(k)+'</td><td>'+av+'</td><td>'+bv+'</td></tr>'}h+='<tr><td>'+esc(E[LANG].requirements)+'</td><td>RAM '+esc(a.ramMin)+' / '+esc(a.ramRec)+'</td><td>RAM '+esc(b.ramMin)+' / '+esc(b.ramRec)+'</td></tr></table></div>';$('content').innerHTML=h}
function mypc(){var h='<div class="panel"><h2>'+esc(E[LANG].mypc)+'</h2><p>'+esc(LANG=='ru'?'Простой режим подбора для слабого ПК. Он не изменяет исходные данные.':'Simple low-end PC helper. It does not change source data.')+'</p><div class="field"><label>'+esc(E[LANG].ram)+'</label><input id="pcRam" value="64"></div><div class="field"><label>'+esc(E[LANG].disk)+'</label><input id="pcDisk" value="10"></div><div class="field"><label>'+esc(E[LANG].arch)+'</label><select id="pcArch"><option value="x86">x86</option><option value="x86_64">x86_64</option><option value="any">'+(LANG=='ru'?'Любая':'Any')+'</option></select></div><button class="btn" onclick="Atlas.checkPC()">'+esc(E[LANG].check)+'</button> <button class="btn" onclick="Atlas.goHome()">'+esc(E[LANG].back)+'</button><div id="pcResult"></div></div>';$('content').innerHTML=h}
function checkPC(){var ram=parseInt($('pcRam').value,10)||64,disk=parseInt($('pcDisk').value,10)||10,arch=$('pcArch').value;var out=[];for(var i=0;i<DATA.length;i++){var o=DATA[i],r=String(o.ramMin||''),d=String(o.diskMin||'');var rn=parseInt(r.replace(/[^0-9]/g,''),10);var dn=parseInt(d.replace(/[^0-9]/g,''),10);if(rn&&rn>ram)continue;if(dn&&dn>disk)continue;if(arch!='any'&&o._atlas6Hw&&o._atlas6Hw.arch&&o._atlas6Hw.arch!='device-specific'&&String(o._atlas6Hw.arch).indexOf(arch)<0)continue;out.push(o)}out.sort(function(a,b){return ((a.scores&&a.scores.light)||0)-((b.scores&&b.scores.light)||0)});var h='<div class="panel"><b>'+out.length+'</b> '+esc(E[LANG].count)+'</div>';var lim=Math.min(out.length,40);for(var i=0;i<lim;i++)h+=card(out[i]);$('pcResult').innerHTML=h}
function route(){var hash=location.hash||'#home';if(hash.indexOf('#os-')==0){var id=parseInt(hash.substring(4),10);detail(byId(id));return}if(hash=='#analytics'){analytics();return}if(hash=='#compare'){compare();return}if(hash=='#mypc'){mypc();return}renderHome()}
function applyTheme(){document.body.style.backgroundColor=THEME=='dark'?'#111':'#fff';document.body.style.color=THEME=='dark'?'#eee':'#111';var top=$('top');if(top){top.style.backgroundColor=THEME=='dark'?'#222':'#d6d6d6';top.style.color=THEME=='dark'?'#eee':'#111'}}
function header(){var h='<div id="top"><div class="wrap"><h1>Linux Atlas Micro</h1><span class="sub">215 Linux systems</span><div class="nav"><a href="#home">'+esc(E[LANG].home)+'</a><a href="#analytics">'+esc(E[LANG].analytics)+'</a><a href="#mypc">'+esc(E[LANG].mypc)+'</a><a href="#compare">'+esc(E[LANG].compare)+'</a><a href="javascript:Atlas.toggleLang()">'+esc(E[LANG].language)+'</a><a href="javascript:Atlas.toggleTheme()">'+esc(THEME=='dark'?E[LANG].theme2:E[LANG].theme)+'</a></div></div></div>';$('top').outerHTML=h;applyTheme()}
function boot(){load();initFamilies();header();route();if(window.attachEvent)window.attachEvent('onhashchange',route);else if(window.onhashchange!==undefined)window.onhashchange=route}
window.Atlas={searchKey:function(e){e=e||window.event;if(e&&e.keyCode!=13&&e.keyCode!=8&&e.keyCode!=32){}QUERY=$('q').value;PAGE=1;renderHome()},setFamily:function(v){FAMILY=v;PAGE=1;renderHome()},setStatus:function(v){STATUS=v;PAGE=1;renderHome()},setSort:function(v){SORT=v;PAGE=1;renderHome()},toggleView:function(){VIEW=VIEW=='cards'?'table':'cards';PAGE=1;renderHome()},page:function(d){PAGE+=d;renderHome()},reset:function(){QUERY='';FAMILY='all';STATUS='all';SORT='id';PAGE=1;renderHome()},goHome:function(){location.hash='#home'},openOS:function(id){location.hash='#os-'+id},addCompare:function(id){if(COMPARE_A==null){COMPARE_A=id}else if(COMPARE_B==null&&COMPARE_A!=id){COMPARE_B=id}else if(COMPARE_A!=id){COMPARE_A=id;COMPARE_B=null}location.hash='#compare'},toggleLang:function(){LANG=LANG=='ru'?'en':'ru';save();header();route()},toggleTheme:function(){THEME=THEME=='light'?'dark':'light';save();applyTheme()},checkPC:checkPC};
boot();
})();
</script>
